# Indico configuration for the visual regression suite (container paths).
# This file is checked into the repo because the paths are now stable —
# they reference container mount points, not host directories.

import os

SQLALCHEMY_DATABASE_URI = 'postgresql://indico:indico@postgres/indico_visual'
SECRET_KEY = b'visual-regression-suite-fixed-secret-key-32-bytes!'
BASE_URL = 'http://indico:8000'
# The server runs under a frozen clock (INDICO_VISUAL_FROZEN_TIME) while the
# Playwright runner uses real (wall-clock) time. Indico stamps both the session
# cookie's Expires and the session's `_expires` field from the frozen "now", so
# any normal lifetime lands in the past relative to the runner — the runner
# drops the cookie (login fails on CSRF) and the client shows a spurious
# "session expired" dialog mid-capture. A very large lifetime keeps
# frozen-now + lifetime far ahead of real time on both counts. (Not 0 /
# "browser session": that path uses the 7-day temporary lifetime for `_expires`,
# which is already in the past under the frozen clock, hence the dialog.)
SESSION_LIFETIME = 86400 * 3650  # ~10 years
CELERY_BROKER = 'redis://redis:6379/8'
REDIS_CACHE_URL = 'redis://redis:6379/9'
DEFAULT_TIMEZONE = 'UTC'
DEFAULT_LOCALE = 'en_GB'
ENABLE_ROOMBOOKING = False
PLUGINS = ()

CACHE_DIR = '/regressions/output/runtime/cache'
TEMP_DIR = '/regressions/output/runtime/tmp'
LOG_DIR = '/regressions/output/runtime/log'
STORAGE_BACKENDS = {'default': 'fs:/regressions/output/runtime/storage'}
ATTACHMENT_STORAGE = 'default'

LOCAL_PASSWORD_MIN_LENGTH = 8

SMTP_SERVER = ('127.0.0.1', 1025)
SMTP_USE_TLS = False
SMTP_USE_CELERY = False
SUPPORT_EMAIL = 'visual-regression@example.test'
PUBLIC_SUPPORT_EMAIL = 'visual-regression@example.test'
NO_REPLY_EMAIL = 'noreply@example.test'

DB_LOG = False
DEBUG = False
XELATEX_PATH = '/bin/true'

for _path in (CACHE_DIR, TEMP_DIR, LOG_DIR, STORAGE_BACKENDS['default'].split(':', 1)[1]):
    os.makedirs(_path, exist_ok=True)
